lint.ignore = [
  "E203", "E226", "E228", "N802", "N803", "N806", "N812", "N813", "N815", "N816", "N999"
]
line-length = 110
exclude = ["__init__.py", "doc/conf.py"]
lint.select = ["E", "F", "I", "N", "W"]
[lint.pycodestyle]
max-doc-length = 79
[lint.pydocstyle]
convention = "numpy"
[lint.isort]
known-first-party = ["lsst"]
# `tests/` is not a package, so pytest puts each test's own directory on
# sys.path and a sibling test imports as a bare top-level module. Without this
# those imports sort as third-party, landing among numpy and astropy.
known-local-folder = ["test_*"]
