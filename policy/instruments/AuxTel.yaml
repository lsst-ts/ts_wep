# LATISS Telescope Parameters
# lsst.obs.lsst.Latiss

name: AuxTel
diameter: 1.2 # aperture diameter in meters
obscuration: 0.3525 # fractional obscuration ( = 0.423 m / 1.2 m)
focalLength: 21.6 # effective focal length in meters
pixelSize: 10.0e-6 # pixel size in meters
wavelength: 632.0e-9 # effective wavelength, in meters
batoidModelName: AuxTel # name used to load the Batoid model
batoidOffsetOptic: M2 # the name of the batoid element to offset (default = Detector)
batoidOffsetValue: 0.8e-3 # batoid offset in meter (default = defocalOffset)

# Mask parameters are loaded from the danish package's data directory.
maskParamsFile: AuxTelObsc.yaml
