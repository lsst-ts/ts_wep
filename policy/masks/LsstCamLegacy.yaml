# Pupil mask model for LSSTCam as used before danish shipped fitted mask
# models, kept so a fit can be reproduced against it.
#
# Same format danish's own mask files use (see danish/data/RubinObsc_*.yaml):
# element -> side -> {clear, thetaMin, thetaMax, center, radius}, where center
# and radius are polynomials in field angle, in meters, and the angles are in
# degrees.  Selected via WavefrontFittingConfig.maskModel as
# "policy:masks/LsstCamLegacy.yaml".
#
# Six elements against the 13 in danish's v3.14 model: the lens and filter exit
# surfaces and the camera body are absent, and thetaMax stops at 1.85 rather
# than 2.0.  Both are why it is not the default.
